---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: petclinic
type: servicebinding.io/mysql
stringData:
  type: "mysql"
  provider: "mysql"
  port: "3306"
  MYSQL_ROOT_PASSWORD: root
  MYSQL_DATABASE: petclinic
  MYSQL_USER: petclinic
  MYSQL_PASSWORD: petclinic  


#   MYSQL_ROOT_PASSWORD=root
# MYSQL_DATABASE=petclinic
# MYSQL_USER=petclinic
# MYSQL_PASSWORD=petclinic
