---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
  namespace: petclinic
  labels:
    app: petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
    spec:
      containers:
        - name: workload
          image: baselabouelnour/spring-petclinic:latest
          env:
            - name: MYSQL_URL
              valueFrom:
                secretKeyRef:
                  name: petclinic-secret
                  key: MYSQL_URL
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: petclinic-secret
                  key: MYSQL_USER
            - name: MYSQL_PASS
              valueFrom:
                secretKeyRef:
                  name: petclinic-secret
                  key: MYSQL_PASS
            - name: SPRING_SQL_INIT_MODE
              valueFrom:
                secretKeyRef:
                  name: petclinic-secret
                  key: SPRING_SQL_INIT_MODE
            - name: SPRING_PROFILES_ACTIVE
              value: mysql
            - name: SERVICE_BINDING_NAME
              value: mysql
            - name: SERVICE_BINDING_ROOT
              value: /bindings
            - name: SPRING_APPLICATION_JSON
              value: |
                {
                  "management.endpoint.health.probes.add-additional-paths": true
                }
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          volumeMounts:
            - mountPath: /bindings/secret
              name: binding
              readOnly: true
      volumes:
        - name: binding
          projected:
            sources:
              - secret:
                  name: mysql-secrets
