name: continous-integration for petclinic
on:
  push:
    branches: [ main, github/workflows ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set runner date
        run: echo "RUN_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: baselabouelnour/spring-petclinic:$RUN_DATE, baselabouelnour/spring-petclinic:latest


