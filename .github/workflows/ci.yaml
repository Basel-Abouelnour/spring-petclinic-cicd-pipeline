name: continous-integration for petclinic
on:
  push:
    branches: [ main, github/workflows ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maven-compile-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'adopt'
          cache: maven

      - name: compile with maven 
        run: mvn clean compile
        
      - name: Test with maven
        run: mvn test -Dtest=!PostgresIntegrationTests
  
  set-runner-date:
    runs-on: ubuntu-latest
    needs: maven-compile-and-test
    outputs:
      date_tag: ${{ steps.set_date.outputs.date_tag }}

    steps:
      - name: Set runner date
        id: set_date
        run: echo "date_tag=$(date +'%y%m%d')" >> $GITHUB_OUTPUT

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: [maven-compile-and-test, set-runner-date]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: baselabouelnour/spring-petclinic:${{ needs.set-runner-date.outputs.date_tag }}, baselabouelnour/spring-petclinic:latest

  change-k8s-deployment-image:
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Update image tag in k8s/petclinic.yml 
        env:
          DATE_TAG: ${{ needs.set-runner-date.outputs.date_tag }}
        run: |
         sed -i "s|image: baselabouelnour/spring-petclinic:.*|image: baselabouelnour/spring-petclinic:${DATE_TAG}|g" k8s/petclinic.yml

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add k8s/petclinic.yml
          git commit -m "Update app version [skip ci]" || echo "No changes"
          git push
