name: continous-integration for petclinic
on:
  push:
    branches: [ main, github/workflows ]
  pull_request:
    branches: [ main ]

jobs:
  maven-compile-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'adopt'
          cache: maven

      - name: compile with maven 
        run: maven clean compile

      - name: Test with maven
        run: maven clean test

  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set runner date
        run: echo "DATE_TAG=$(date +'%y%m%d')" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: baselabouelnour/spring-petclinic:${{ env.DATE_TAG }}, baselabouelnour/spring-petclinic:latest


